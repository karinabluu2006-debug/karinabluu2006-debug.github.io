    <script>
      /* 首屏定主题：和 src/theme.js 的优先级一致，避免开门动画跟整站颜色不一致 */
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var h = new Date().getHours()
          var auto = h >= 6 && h < 19 ? 'day' : 'night'
          var t = q === 'day' || q === 'night' ? q : q === 'auto' ? auto : null
          if (!t) {
            var s = localStorage.getItem('mochi-theme')
            t = s === 'day' || s === 'night' ? s : auto
          }
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t === 'day' ? 'light' : 'dark'
        } catch (e) {}
      })()
    </script>

lign:center;opacity:0;max-width:86vw;margin:6px 0 0;font-size:12px;line-height:1.7;animation:.5s 6s forwards sp-in;position:relative}#splash .sp-alt a{color:#30d4a8;border-bottom:1px solid;text-decoration:none}:root[data-theme=day] #splash .sp-alt a{color:#0d9a7c}@keyframes sp-bob{0%,to{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sp-dot{0%,to{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes sp-slide{0%{transform:translate(-120%)}to{transform:translate(300%)}}@keyframes sp-in{to{opacity:.5}}@media (prefers-reduced-motion:reduce){#splash,#splash .sp-stage{transition-duration:1ms}#splash img,#splash .sp-d i,#splash .sp-bar i{animation:none}}</style>

    <!-- 开门动画放在 #root 外面：React 挂载不会把它一起清掉，

        if (location.hostname.indexOf('github.io') > -1) {
