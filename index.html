<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>张贵洋 · Mochi 的房间</title>
    <meta name="description" content="一个可以点开来看的房间：软件工程 × 视觉叙事 × 独立游戏。" />
    <link rel="icon" type="image/png" href="mochi/poses/wave.png" />
    <link rel="apple-touch-icon" href="mochi/poses/wave.png" />
    <link rel="preload" href="fonts/MatchaStyle.otf" as="font" type="font/otf" crossorigin />
    <meta name="theme-color" content="#0b1110" />
    <script>
      /* 首屏定主题：和 src/theme.js 的优先级一致，避免开门动画跟整站颜色不一致 */
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var h = new Date().getHours()
          var auto = h >= 6 && h < 19 ? 'day' : 'night'
          var t = q === 'day' || q === 'night' ? q : q === 'auto' ? auto : null
          if (!t) {
            var s = localStorage.getItem('mochi-theme')
            t = s === 'day' || s === 'night' ? s : auto
          }
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
    <style>html,body{background:#0b1110;margin:0}:root[data-theme=day] body{background:#ecf2f0}#splash{z-index:9999;color:#e6f0ec;background:#0b1110;flex-direction:column;justify-content:center;align-items:center;gap:16px;font-family:PingFang SC,Microsoft YaHei,system-ui,-apple-system,sans-serif;display:flex;position:fixed;inset:0}:root[data-theme=day] #splash{color:#1a2321;background:#ecf2f0}#splash img{-o-object-fit:contain;object-fit:contain;width:68px;height:68px;image-rendering:pixelated;animation:1.7s ease-in-out infinite sp-bob}#splash .sp-t{letter-spacing:.18em;opacity:.8;margin:0;font-size:14px}#splash .sp-d{vertical-align:1px;gap:4px;margin-left:7px;display:inline-flex}#splash .sp-d i{background:#30d4a8;border-radius:50%;width:4px;height:4px;animation:1.15s ease-in-out infinite sp-dot}:root[data-theme=day] #splash .sp-d i{background:#0d9a7c}#splash .sp-d i:nth-child(2){animation-delay:.16s}#splash .sp-d i:nth-child(3){animation-delay:.32s}#splash .sp-bar{background:#e6f0ec21;border-radius:2px;width:116px;height:2px;overflow:hidden}:root[data-theme=day] #splash .sp-bar{background:#1a23211a}#splash .sp-bar i{background:#30d4a8;border-radius:2px;width:38%;height:100%;animation:1.5s ease-in-out infinite sp-slide;display:block}:root[data-theme=day] #splash .sp-bar i{background:#0d9a7c}#splash .sp-alt{text-align:center;opacity:0;margin:6px 0 0;font-size:12px;line-height:1.7;animation:.5s 6s forwards sp-in}#splash .sp-alt a{color:#30d4a8;border-bottom:1px solid;text-decoration:none}:root[data-theme=day] #splash .sp-alt a{color:#0d9a7c}@keyframes sp-bob{0%,to{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sp-dot{0%,to{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes sp-slide{0%{transform:translate(-120%)}to{transform:translate(300%)}}@keyframes sp-in{to{opacity:.5}}@media (prefers-reduced-motion:reduce){#splash img,#splash .sp-d i,#splash .sp-bar i{animation:none}}</style>
    <script type="module" crossorigin src="./assets/index-BLCrloW5.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-1INoti8B.css">
  </head>
  <body>
    <div id="root">
      <!-- React 挂载时会整块替换掉这层「开门动画」，所以它只在首屏加载期间出现 -->
      <div id="splash">
        <img src="mochi/poses/wave.png" alt="" />
        <p class="sp-t">正在开门<span class="sp-d"><i></i><i></i><i></i></span></p>
        <div class="sp-bar"><i></i></div>
        <p class="sp-alt">网络慢的时候要等一会儿，别急着关。<br />实在打不开，<a id="sp-alt-link" href="https://karinabluu2006-debug.github.io/">换个地址试试</a></p>
      </div>
    </div>
    <noscript>
      <p style="padding:40px;font:14px/1.8 system-ui;color:#e6f0ec;background:#0b1110">
        这个房间需要开启 JavaScript 才能进门。请在浏览器设置里打开后再刷新一次。
      </p>
    </noscript>
    <script>
      /* 备用地址：在 GitHub 版上指向主站，在主站上指向 GitHub 版 */
      (function () {
        var a = document.getElementById('sp-alt-link')
        if (!a) return
        if (location.hostname.indexOf('github.io') > -1) {
          a.href = 'https://guiyang-site.app.workbuddy.host/?sharecode=OZUX2NMDE2'
          a.textContent = '试试主站版'
        } else {
          a.href = 'https://karinabluu2006-debug.github.io/'
          a.textContent = '试试 GitHub 版'
        }
      })()
    </script>
  </body>
</html>
